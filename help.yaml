# Commands this package provides, for astro's help browser and verbs (`astro NAME [args]`).
package: mhseals_hardware
summary: Thruster stack (driver, command mux, velocity controller), mixer tools and bench tests.
commands:
  - name: drive
    level: core
    host: boat_computer
    run: ros2 launch mhseals_hardware drive.launch.py
    summary: Start the thruster stack - thruster_pwm_node and command_mux, plus the velocity controller with controller:=true.
    notes: The only way the stack starts. Effort on topics.effort drives through the mux; RC and the keys take over. Ctrl-C stops it at neutral.
    params:
      - {name: output_backend, choices: [odroid, topic], default: auto, description: 'Where pulses go; auto keeps the config value (odroid pins, or topic for the sim).'}
      - {name: use_sim_time, type: bool, default: false, description: Use the simulator clock.}
      - {name: controller, type: bool, default: false, description: Also start calibrated_velocity_controller (topics.auto -> topics.effort; needs characterization).}
      - {name: config_file, type: path, default: auto, description: 'Hardware YAML; auto is $MHSEALS_HARDWARE_CONFIG or ~/.config/mhseals/hardware.yaml.'}
    examples:
      - ros2 launch mhseals_hardware drive.launch.py
      - ros2 launch mhseals_hardware drive.launch.py output_backend:=topic use_sim_time:=true

  - name: estop
    level: core
    host: boat_computer
    run: ros2 service call /thruster_pwm_node/estop std_srvs/srv/Trigger
    summary: Stop the thrusters now (ESC power cut, latched); astro estop clear clears it.
    notes: Cuts ESC power through the MOSFET and latches (cause operator). The RC stop channel does the same.

  - name: estop clear
    level: core
    host: boat_computer
    run: ros2 service call /thruster_pwm_node/clear std_srvs/srv/Trigger
    summary: Clear a latched e-stop; the ESCs power up again at neutral.
    notes: Refused while the RC stop switch is still down (flip it up first). Also clears a heartbeat stall.

  - name: mix
    level: core
    host: boat_computer
    run: ros2 run mhseals_hardware mix
    summary: Print every mixer stage (C/C-, M rows, thrust sum, e|e|, desaturation, reversed, PWM, channel) for one effort command.
    params:
      - {name: surge, type: float, required: false, description: 'Surge effort, -1 to 1.'}
      - {name: sway, type: float, required: false, description: 'Sway effort, -1 to 1.'}
      - {name: yaw, type: float, required: false, description: 'Yaw effort, -1 to 1.'}
      - {name: --live, type: bool, description: 'Follow topics.applied instead (give no command).'}
      - {name: --config, type: path, default: auto, description: 'Hardware YAML; auto is the active one.'}
    examples:
      - ros2 run mhseals_hardware mix 0.5 0 0
      - ros2 run mhseals_hardware mix --live

  - name: keyboard
    level: core
    host: boat_computer
    run: ros2 run mhseals_hardware keyboard
    summary: Deadman keyboard driving on the manual lane (topics.manual); WASD/arrows, Space neutral, X exit.
    notes: Needs the stack (drive). Secure the boat and clear the propellers.
    params:
      - {name: --speed, type: float, description: 'Initial thrust fraction, 0 to 1.'}
      - {name: --dry-run, type: bool, description: Test terminal keys without publishing.}
      - {name: --config, type: path, default: auto, description: 'Hardware YAML; auto is the active one.'}
    examples:
      - ros2 run mhseals_hardware keyboard --speed 0.3

  - name: thrusters
    level: core
    host: boat_computer
    run: ros2 run mhseals_hardware thrusters
    summary: The thrusters screen - drive each output with a strength bar, set wiring and pins, save to the vessel profile.
    notes: 'Keys in labelled groups (Drive, Wiring, Power) at the bottom; the selected row''s fields show above them, and p lists every J2 PWM pin with its overlay state. A pulse opens the outputs (MOSFET on, ESCs held neutral 3 s). k frees pins another program holds. s shows the profile diff, then y saves. Secure the boat and clear the propellers.'
    examples:
      - astro thrusters

  - name: thrusters test
    level: core
    host: boat_computer
    run: ros2 run mhseals_hardware thrusters test
    summary: Same screen as thrusters - set each output's pulse by hand.

  - name: thrusters config
    level: core
    host: boat_computer
    run: ros2 run mhseals_hardware thrusters config
    summary: Same screen as thrusters - thruster to output (t), reversed (r), PWM pin (p); s saves to the vessel profile thrusters:.

  - name: thrusters wiring
    level: core
    host: boat_computer
    run: ros2 run mhseals_hardware thrusters wiring
    summary: Pulse each output in turn and answer what moved; saves channel_map and reversed to hardware.yaml.
    notes: Stop the stack first (astro down drive, or thrusters free). Boat tied up, propellers clear and submerged.
    params:
      - {name: --manual, type: bool, description: Enter the mapping by hand instead of pulsing outputs.}
      - {name: --output-backend, choices: [odroid, topic], default: auto, description: 'ODROID pins or the simulator topic; auto takes it from the config.'}
      - {name: --config, type: path, default: auto, description: 'Hardware YAML the channel_map is saved to; auto is the active one.'}

  - name: thrusters mosfet
    level: core
    host: boat_computer
    run: ros2 run mhseals_hardware thrusters mosfet
    summary: Hold the MOSFET enable (ESC power) on; writes no PWM. Ctrl-C, SIGTERM or thrusters free releases it.
    params:
      - {name: --seconds, type: float, description: 'Release after this long (default: hold until stopped).'}
      - {name: --config, type: path, default: auto, description: 'Hardware YAML; auto is the active one.'}
    examples:
      - astro thrusters mosfet --seconds 5

  - name: thrusters free
    level: core
    host: boat_computer
    run: ros2 run mhseals_hardware thrusters free
    summary: Stop every program holding the thruster pins or MOSFET, set neutral, release them; one row per output.
    notes: Exit 0 when every row is free.
    params:
      - {name: --check, type: bool, description: Only report who holds what.}
    examples:
      - astro thrusters free --check

  - name: config_check
    level: setup
    host: boat_computer
    run: ros2 run mhseals_hardware config_check
    summary: Check a hardware YAML through the driver's loader; exit 0 (ok) or 1 with the reason.
    params:
      - {name: file, type: path, required: false, default: auto, description: 'The hardware YAML to check; auto is the active one ($MHSEALS_HARDWARE_CONFIG or ~/.config/mhseals/hardware.yaml).'}
    examples:
      - ros2 run mhseals_hardware config_check ~/.config/mhseals/hardware.yaml

  - name: odroid_access
    level: setup
    host: boat_computer
    run: ~/astro_dock/src/mhseals_hardware/scripts/install_odroid_access.sh
    summary: Install the ODROID host service that exports the PWM channels and grants access to them and the MOSFET bank.
    notes: Once per ODROID, on the host (sudo); then recreate the container.

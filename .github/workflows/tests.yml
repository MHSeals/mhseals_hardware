name: Hardware tooling tests (no physical devices)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  # The smoke tier gates landing (<60 s): config load and schema, the mixer, live parameters.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest rich PyYAML numpy setuptools wheel
      - run: python -m pytest -q -m smoke test
        env:
          PYTHONPATH: .
  # The full suite reports but never blocks.
  tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest rich PyYAML numpy setuptools wheel
      - run: python -m pytest -q test
        env:
          PYTHONPATH: .
